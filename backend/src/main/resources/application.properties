# Application
spring.application.name=finsentinel

# Server
server.port=8080

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finsentinel}
spring.datasource.username=${DB_USERNAME:finsentinel_user}
spring.datasource.password=${DB_PASSWORD:local_dev_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Flyway Database Migrations
spring.flyway.enabled=true

# JWT Configuration
app.security.jwt.secret=${JWT_SECRET}

app.security.verification-base-url=http://localhost:8080/api/v1/auth/verify-email
spring.profiles.default=dev
finsentinel.ml.service.url=${ML_SERVICE_URL:http://localhost:8001}
